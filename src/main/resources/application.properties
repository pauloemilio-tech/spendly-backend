spring.datasource.url=${DB_SPENDLY_URL}
spring.datasource.username=${DB_SPENDLY_USERNAME}
spring.datasource.password=${DB_SPENDLY_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-in-minutes=60

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://spendly-fawn.vercel.app}

spring.application.name=spendly
